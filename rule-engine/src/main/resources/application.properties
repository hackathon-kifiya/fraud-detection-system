server.port=8081
spring.application.name=java-engine

# SpringDoc OpenAPI/Swagger configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Database configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/frauddb}
spring.datasource.username=${DATABASE_USER:frauduser}
spring.datasource.password=${DATABASE_PASSWORD:fraudpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JDBC configuration
spring.sql.init.mode=never
spring.sql.init.enabled=false

# SQL logging for debugging
logging.level.org.springframework.jdbc.core=TRACE
logging.level.com.frauddetection.repository=DEBUG
logging.level.org.springframework.data.jdbc.core=DEBUG
logging.level.org.springframework.dao=DEBUG
logging.level.org.springframework.transaction=DEBUG

# Sample data directory configuration
sample.data.directory=${SAMPLE_DATA_DIRECTORY:../data}

