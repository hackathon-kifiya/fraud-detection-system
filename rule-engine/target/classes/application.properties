server.port=8081
spring.application.name=java-engine

# Database configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/frauddb}
spring.datasource.username=${DATABASE_USER:frauduser}
spring.datasource.password=${DATABASE_PASSWORD:fraudpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JDBC configuration
spring.jdbc.initialize-mode=never
spring.sql.init.mode=never

