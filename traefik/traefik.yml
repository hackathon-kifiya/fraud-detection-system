# Traefik Static Configuration
api:
  dashboard: true
  insecure: true
  debug: true

# Entry Points
entryPoints:
  web:
    address: ":80"
  dashboard:
    address: ":8082"

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "fraud-detection_default"
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

# Logging
log:
  level: DEBUG
  filePath: "/var/log/traefik/traefik.log"

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json

# Metrics
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true

# Health Check
ping:
  entryPoint: "web"

