# Traefik Dynamic Configuration
http:
  middlewares:
    # Rate Limiting
    rate-limit:
      rateLimit:
        burst: 50
        average: 100
        period: 1m
    
    # CORS
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - "http://localhost:3001"
          - "http://localhost"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
        accessControlAllowCredentials: true
        accessControlMaxAge: 100
        addVaryHeader: true
    
    # Compression
    compress:
      compress: {}
    
    # Circuit Breaker
    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.5"
    
    # Retry
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms
        maxInterval: 1s
        multiplier: 2
    
    # Strip Prefix for Backend
    strip-backend-prefix:
      stripPrefix:
        prefixes:
          - "/api/backend"
    
    # Strip Prefix for Rule Engine
    strip-rules-prefix:
      stripPrefix:
        prefixes:
          - "/api/rules"
    
    # Strip Prefix for Evaluate
    strip-evaluate-prefix:
      stripPrefix:
        prefixes:
          - "/api/evaluate"
    
    # Strip Prefix for Anomaly
    strip-anomaly-prefix:
      stripPrefix:
        prefixes:
          - "/api/anomaly"
    
    # Strip Prefix for Predict
    strip-predict-prefix:
      stripPrefix:
        prefixes:
          - "/api/predict"
    
    # Strip Prefix for Risk
    strip-risk-prefix:
      stripPrefix:
        prefixes:
          - "/api/risk"
    
    # Error Pages
    error-pages:
      errors:
        status:
          - "400-599"
        service: error-service
        query: "/{status}.html"
  
  services:
    # Error Service
    error-service:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"

  routers:
    # Error Pages Router
    error-pages:
      rule: "PathPrefix(`/error`)"
      service: error-service
      middlewares:
        - error-pages
