version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: frauduser
      POSTGRES_PASSWORD: fraudpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauduser -d frauddb"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    build: ./engine
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://frauduser:fraudpass@postgres:5432/frauddb
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgresql://frauduser:fraudpass@postgres:5432/frauddb
      - ENGINE_URL=http://engine:5001
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8081
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
