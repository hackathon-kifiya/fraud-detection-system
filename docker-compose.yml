version: "3.8"

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.dashboard.address=:8083"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog.format=json"
      - "--metrics.prometheus=true"
      - "--ping=true"
    ports:
      - "80:80"
      - "8083:8083"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - default
    restart: unless-stopped
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: frauduser
      POSTGRES_PASSWORD: fraudpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauduser -d frauddb"]
      interval: 10s
      timeout: 5s
      retries: 5
  anomaly-detection-engine:
    build: ./anomaly-detection-engine
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://frauduser:fraudpass@postgres:5432/frauddb
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rule-engine:
    build: ./rule-engine
    ports:
      - "8082:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/frauddb
      - DATABASE_USER=frauduser
      - DATABASE_PASSWORD=fraudpass
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rule-engine.rule=PathPrefix(`/api/rules`) || PathPrefix(`/api/evaluate`)"
      - "traefik.http.routers.rule-engine.entrypoints=web"
      - "traefik.http.routers.rule-engine.service=rule-engine"
      - "traefik.http.routers.rule-engine.priority=1"
      - "traefik.http.routers.rule-engine.middlewares=cors@file"
      - "traefik.http.services.rule-engine.loadbalancer.server.port=8081"
      - "traefik.http.services.rule-engine.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.rule-engine.loadbalancer.healthcheck.interval=30s"

  backend:
    build: ./backend
    ports:
      - "8081:4000"
    environment:
      - DATABASE_URL=postgresql://frauduser:fraudpass@postgres:5432/frauddb
      - ENGINE_URL=http://rule-engine:8081/api
      - PYTHON_STATS_URL=http://anomaly-detection-engine:5001
    depends_on:
      postgres:
        condition: service_healthy
      rule-engine:
        condition: service_started
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=(PathPrefix(`/api/auth`) || PathPrefix(`/api/users`) || PathPrefix(`/api/admin`) || PathPrefix(`/api/audit`) || PathPrefix(`/api/flagged-items`) || PathPrefix(`/health`)) && !PathPrefix(`/api/rules`) && !PathPrefix(`/api/evaluate`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.routers.backend.middlewares=cors@file"
      - "traefik.http.services.backend.loadbalancer.server.port=4000"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_BACKEND_URL=http://localhost
    ports:
      - "3001:3000"
    depends_on:
      - backend
      - traefik
    restart: unless-stopped

volumes:
  postgres_data:
