version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: frauduser
      POSTGRES_PASSWORD: fraudpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauduser -d frauddb"]
      interval: 10s
      timeout: 5s
      retries: 5
  anomaly-detection-engine:
    build: ./anomaly-detection-engine
    environment:
      - DATABASE_URL=postgresql://frauduser:fraudpass@postgres:5432/frauddb
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prediction-engine:
    build: ./prediction-engine
    environment:
      - DATABASE_URL=postgresql://frauduser:fraudpass@postgres:5432/frauddb
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  risk-aggregation-engine:
    build: ./risk-aggregation-engine
    environment:
      - DATABASE_URL=postgresql://frauduser:fraudpass@postgres:5432/frauddb
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rule-engine:
    build: ./rule-engine
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/frauddb
      - DATABASE_USER=frauduser
      - DATABASE_PASSWORD=fraudpass
      - SERVER_PORT=8081
      - SAMPLE_DATA_DIRECTORY=/app/data
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://frauduser:fraudpass@postgres:5432/frauddb
      - ENGINE_URL=http://rule-engine:8081
      - ANOMALY_DETECTION_ENGINE_URL=http://anomaly-detection-engine:5001
      - PREDICTIVE_ENGINE_URL=http://prediction-engine:5002
      - RISK_AGGREGATION_ENGINE_URL=http://risk-aggregation-engine:5003
      - PYTHON_STATS_URL=http://anomaly-detection-engine:5001
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rule-engine:
        condition: service_started
      anomaly-detection-engine:
        condition: service_started
      prediction-engine:
        condition: service_started
      risk-aggregation-engine:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_BACKEND_URL=http://localhost:8080
        - REACT_APP_RULE_ENGINE_URL=http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3002:3001"
    restart: unless-stopped
    environment:
      - UPTIME_KUMA_HOST=0.0.0.0
      - UPTIME_KUMA_PORT=3001


volumes:
  postgres_data:
  uptime_kuma_data:
